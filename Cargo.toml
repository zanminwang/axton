[workspace]
members = ["crates/core", "crates/protocols", "crates/server", "crates/client", "crates/sqlite", "bindings/common", "bindings/dart", "bindings/mobile", "crates/compiler", "crates/sim"]
exclude = ["bindings/node"]
resolver = "3"

[workspace.package]
version = "0.5.6"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serde_jcs = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
