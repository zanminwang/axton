[package]
name = "axton-node"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
axton-binding = { path = "../common" }
axton-server = { path = "../../crates/server" }
serde_json = "1"
napi = { version = "=3.12.2", features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.4"
[features]
# Test-only transaction-bridge probe; never part of the normal addon.
probe = []
[build-dependencies]
napi-build = "=2.4.2"
